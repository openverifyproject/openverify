[pytest]
addopts = -ra --confcutdir=tests/golden_v4 --tb=short
pythonpath = ../../src ../..
junit_family = xunit2
markers =
    golden_v4: independent Golden v4
    vcp: normative VCP
    provider: normative Provider Contract
    relay: local Relay profile
    entrypoint: public host integration
    result: Result semantics
    decision: Decision semantics
    dataflow: explicit dataflow
    aggregate: reducer semantics
    policy: policy-to-occurrence
    graph: graph structure
    provenance: record lineage
    scheduler: waves and barriers
    port: replaceable port
    cheap: in-memory
    runtime: live provider/Relay
    integration: actual host/transport
    valid: accepted or permitted
    invalid: rejected
    direct: direct witness
    property: algebraic/metamorphic
    composition: interaction witness
    proof_check: mathematical projection or reduction
    wire: structural rules
    binding: binding identity
    availability: source availability
    guard: equality guard
    record: occurrence record
    lifecycle: lifecycle
    unsupported: declared unsupported scope
    ambiguous: explicitly unresolved
