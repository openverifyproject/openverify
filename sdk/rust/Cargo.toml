[package]
name = "verifyanything"
version = "0.1.1"
edition = "2024"
description = "VerifyAnything DRAFT VCP and Provider Contract wire SDK"
license = "MIT"
repository = "https://github.com/openverifyproject/openverify"
readme = "README.md"
include = ["src/**", "schemas/**", "LICENSE", "README.md", "Cargo.toml"]

[lib]
name = "verifyanything"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
jsonschema = { version = "0.59.0", default-features = false }

[dev-dependencies]
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
