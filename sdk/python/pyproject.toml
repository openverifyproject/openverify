[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openverify-wire"
version = "0.1.0"
description = "OpenVerify DRAFT standalone VCP and Provider Contract wire SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["jsonschema>=4.23,<5"]

[project.urls]
Repository = "https://github.com/openverifyproject/openverify"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openverify_sdk = ["bundle.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
