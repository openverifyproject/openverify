name: Release rust SDK
on:
  push:
    tags: ['sdk/rust/v*']
permissions:
  contents: read
concurrency:
  group: sdk-rust-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/sdk-verify.yml
    with:
      language: rust
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: sdk-rust
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4
        with:
          name: sdk-rust-${{ github.sha }}
          path: dist/sdk/rust/
      - name: Check exact tag, test evidence, checksum and unpublished version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REGISTRY_OWNERSHIP_APPROVED: ${{ vars.REGISTRY_OWNERSHIP_APPROVED }}
        run: |
          test "$REGISTRY_OWNERSHIP_APPROVED" = true
          python tools/sdk_release.py preflight --language rust --tag "$RELEASE_TAG" --evidence dist/sdk/rust/verification.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # dtolnay/rust-toolchain@stable
      - name: Exchange GitHub OIDC for a short-lived crates.io token
        if: vars.REGISTRY_AUTH_MODE != 'token'
        uses: rust-lang/crates-io-auth-action@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # rust-lang/crates-io-auth-action@v1
        id: rustauth
      - name: Publish the verified crate contents
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.rustauth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          mkdir -p .sdk-release/crate
          tar -xzf dist/sdk/rust/*.crate -C .sdk-release/crate
          cd .sdk-release/crate/verifyanything-[0-9]*
          cargo publish --locked
      - name: Verify registry availability and a fresh external installation
        env:
          SDK_LANGUAGE: rust
        run: python tools/sdk_verify.py "$SDK_LANGUAGE" --registry-only
