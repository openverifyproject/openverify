name: Release go SDK
on:
  push:
    tags: ['sdk/go/v*']
permissions:
  contents: read
concurrency:
  group: sdk-go-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/sdk-verify.yml
    with:
      language: go
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: sdk-go
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4
        with:
          name: sdk-go-${{ github.sha }}
          path: dist/sdk/go/
      - name: Check exact tag, test evidence, checksum and unpublished version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/sdk_release.py preflight --language go --tag "$RELEASE_TAG" --evidence dist/sdk/go/verification.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Verify public nested-module resolution from the pushed tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          VERSION="${RELEASE_TAG#sdk/go/}"
          mkdir -p "$RUNNER_TEMP/go-registry-consumer"
          cd "$RUNNER_TEMP/go-registry-consumer"
          go mod init registry-consumer
          go get "github.com/openverifyproject/openverify/sdk/go@$VERSION"
          printf '%s\n' 'package main' 'import sdk "github.com/openverifyproject/openverify/sdk/go"' 'func main(){if sdk.SDKVersion==""{panic("missing version")}}' > main.go
          go run .
      - name: Verify registry availability and a fresh external installation
        env:
          SDK_LANGUAGE: go
        run: python tools/sdk_verify.py "$SDK_LANGUAGE" --registry-only
