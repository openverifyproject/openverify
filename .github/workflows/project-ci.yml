name: OpenVerify CI
on:
  pull_request:
  push:
    branches: ['main', 'release/openverify-v0.1']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production:
    name: Python and Golden (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: src
      OPENVERIFY_GOLDEN_SOURCE_REVISION: docs/github-release/SOURCE_REVISION.json
      OPENVERIFY_GOLDEN_EXPECTATION_REVISION: conformance/golden-v4/verification-final/EXPECTATION_CORRECTIONS.json
      OPENVERIFY_RECONCILIATION_OUTPUT: .pytest_cache/github/regressions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - name: Production, property, conformance, Relay and local harness tests
        run: uv run --frozen python -B -m pytest -q tests/unit tests/integration tests/property tests/conformance tests/relay tests/harness tests/test_error_contract_hardening.py --basetemp="${{ runner.temp }}/openverify-production" --junitxml=.pytest_cache/github/production.xml
      - name: Frozen Golden V4 historical baseline
        run: uv run --frozen python tools/run_frozen_golden.py
      - name: All revision regressions and mutation probes
        run: uv run --frozen python -B -m pytest -q tests/golden_v4_reconciliation --junitxml=.pytest_cache/github/regressions.xml
      - name: Build five Python wheels and product source archive
        run: |
          uv build sdk/python --wheel --out-dir dist/python
          uv build packages/relay --wheel --out-dir dist/python
          uv build packages/code --wheel --out-dir dist/python
          uv build packages/english --wheel --out-dir dist/python
          uv build --out-dir dist/python
      - name: Install wheel into a fresh consumer and exercise shipped API/CLI
        shell: python
        run: |
          import os, pathlib, subprocess, venv
          root = pathlib.Path.cwd()
          destination = root / '.pytest_cache/github/consumer'
          venv.EnvBuilder(with_pip=True).create(destination)
          python = destination / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          wheel = next((root / 'dist/python').glob('openverify-*.whl'))
          # Ignore job PYTHONPATH: build-created src/*.egg-info is not an installed wheel.
          subprocess.run([str(python), '-I', '-m', 'pip', 'install', '--find-links',
                          str(root / 'dist/python'), str(wheel)], check=True)
          subprocess.run([str(python), '-I', '-m', 'pip', 'check'], check=True)
          subprocess.run([str(python), '-I', 'conformance/golden-v4/release-review-v0.1/consumer_check.py'], check=True)
      - name: Verify independent Python products and both installation orders
        shell: python
        run: |
          import pathlib, subprocess, sys
          core = next(pathlib.Path('dist/python').glob('openverify-*.whl'))
          sdk = next(pathlib.Path('dist/python').glob('verifyanything-*.whl'))
          subprocess.run([sys.executable, 'tools/python_products_verify.py', '--core-wheel', str(core), '--sdk-wheel', str(sdk)], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: core-python-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/python/
            dist/python-products/verification.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        if: always()
        with:
          name: project-ci-${{ matrix.os }}
          path: |
            .pytest_cache/github/*.xml
            .pytest_cache/github/regressions/*.json*
            .pytest_cache/golden-v4/**/results.jsonl
            .pytest_cache/golden-v4/**/execution.json
          include-hidden-files: true
          if-no-files-found: warn
  node-contract:
    name: Node Provider Contract interoperability
    runs-on: ubuntu-latest
    env:
      OPENVERIFY_TEST_NODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run --frozen python -m pytest tests/harness/test_client.py -q --basetemp="${{ runner.temp }}/openverify-node"
