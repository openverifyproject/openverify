name: Release OpenVerify Python harness
on:
  push:
    tags: ['core/python/v*']
permissions:
  contents: read
concurrency:
  group: core-python-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/project-ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: core-python
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4
        with:
          name: core-python-ubuntu-latest-${{ github.sha }}
          path: dist/core-artifact/
      - name: Verify merged source, independent tag and exact consumer-tested artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/core_release.py --tag "$RELEASE_TAG" --evidence dist/core-artifact/python-products/verification.json --package-directory dist/core-artifact/python --stage-dir dist/publish/python
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/publish/python/
          skip-existing: false
      - name: Install the published harness in an isolated environment
        shell: python
        run: |
          import os, pathlib, subprocess, venv
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'published-core'
          venv.EnvBuilder(with_pip=True).create(destination)
          python = destination / 'bin/python'
          version = os.environ['GITHUB_REF_NAME'].split('/v')[-1]
          subprocess.run([str(python), '-I', '-m', 'pip', 'install', 'openverify==' + version], check=True)
          subprocess.run([str(python), '-I', '-m', 'pip', 'check'], check=True)
          subprocess.run([str(python), '-I', 'conformance/golden-v4/release-review-v0.1/consumer_check.py'], check=True)
