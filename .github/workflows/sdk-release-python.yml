name: Release python SDK
on:
  push:
    tags: ['sdk/python/v*']
permissions:
  contents: read
concurrency:
  group: sdk-python-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/sdk-verify.yml
    with:
      language: python
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: sdk-python
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: sdk-python-${{ github.sha }}
          path: dist/sdk/python/
      - name: Check exact tag, test evidence, checksum and unpublished version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REGISTRY_OWNERSHIP_APPROVED: ${{ vars.REGISTRY_OWNERSHIP_APPROVED }}
        run: |
          test "$REGISTRY_OWNERSHIP_APPROVED" = true
          python tools/sdk_release.py preflight --language python --tag "$RELEASE_TAG" --evidence dist/sdk/python/verification.json
      - name: Publish verified distributions using PyPI OIDC
        run: mkdir -p dist/pypi && cp dist/sdk/python/*.whl dist/sdk/python/*.tar.gz dist/pypi/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi/
          skip-existing: false
      - name: Verify registry availability and a fresh external installation
        env:
          SDK_LANGUAGE: python
        run: python tools/sdk_verify.py "$SDK_LANGUAGE" --registry-only
