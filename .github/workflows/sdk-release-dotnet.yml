name: Release dotnet SDK
on:
  push:
    tags: ['sdk/dotnet/v*']
permissions:
  contents: read
concurrency:
  group: sdk-dotnet-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/sdk-verify.yml
    with:
      language: dotnet
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: sdk-dotnet
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4
        with:
          name: sdk-dotnet-${{ github.sha }}
          path: dist/sdk/dotnet/
      - name: Check exact tag, test evidence, checksum and unpublished version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REGISTRY_OWNERSHIP_APPROVED: ${{ vars.REGISTRY_OWNERSHIP_APPROVED }}
        run: |
          test "$REGISTRY_OWNERSHIP_APPROVED" = true
          python tools/sdk_release.py preflight --language dotnet --tag "$RELEASE_TAG" --evidence dist/sdk/dotnet/verification.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish verified NuGet archive
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push dist/sdk/dotnet/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      - name: Verify registry availability and a fresh external installation
        env:
          SDK_LANGUAGE: dotnet
        run: python tools/sdk_verify.py "$SDK_LANGUAGE" --registry-only
