name: SDK verification
on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build pytest jsonschema pydantic
      - run: python -m pytest sdk/tests -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        if: inputs.language == 'node'
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # dtolnay/rust-toolchain@stable
        if: inputs.language == 'rust'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go@v5
        if: inputs.language == 'go'
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdk/go/go.sum
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # actions/setup-java@v4
        if: inputs.language == 'jvm'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # actions/setup-dotnet@v4
        if: inputs.language == 'dotnet'
        with:
          dotnet-version: '8.0.x'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # ruby/setup-ruby@v1
        if: inputs.language == 'ruby'
        with:
          ruby-version: '3.4'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # shivammathur/setup-php@v2
        if: inputs.language == 'php'
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, dom, xml, xmlwriter
      - name: Shared fixtures, native tests, repeat build and clean consumer
        env:
          SDK_LANGUAGE: ${{ inputs.language }}
        run: python tools/sdk_verify.py "$SDK_LANGUAGE"
      - name: Rust exact publication path, dry-run and repackaged consumer
        if: inputs.language == 'rust'
        run: python tools/sdk_rust_publish.py --dry-run dist/sdk/rust/*.crate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: sdk-${{ inputs.language }}-${{ github.sha }}
          path: dist/sdk/${{ inputs.language }}/
          if-no-files-found: error
