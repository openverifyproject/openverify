[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openverify"
version = "0.1.1"
description = "Draft domain-neutral verification protocol, SDK, and provider-driven Relay runtime"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = ["openverify-relay==0.1.1", "openverify-code[tools]==0.1.1", "openverify-english==0.1.1"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.130",
    "ruff>=0.11",
    "pyright>=1.1.400",
    "types-jsonschema>=4.26.0.20261006",
    "ast-grep-cli>=0.50.0",
    "mcp>=1.10,<2",
    "starlette>=0.40",
    "httpx>=0.28",
    "uvicorn>=0.54.0",
]

[project.scripts]
openverify = "openverify.relay.entrypoints.cli:main"

[project.optional-dependencies]
all = ["ruff>=0.17.0", "pytest>=9.1.1", "ast-grep-cli>=0.50.0", "mcp>=1.10,<2", "starlette>=0.40", "uvicorn>=0.54.0"]
code = [
    "ast-grep-cli>=0.50.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
mcp = [
    "mcp>=1.10,<2",
]
http = [
    "starlette>=0.40",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
openverify-relay = { path = "packages/relay" }
openverify-code = { path = "packages/code" }
openverify-english = { path = "packages/english" }
verifyanything = { path = "sdk/python" }

[tool.setuptools]
packages = []


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_cache/tmp"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["tests/golden_graph"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src", "packages/code/src", "packages/english/src"]
exclude = ["tests/golden_graph"]
venvPath = "."
venv = ".venv"

