[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openverify"
version = "0.1.0"
description = "Draft domain-neutral verification protocol, SDK, and local reference engine"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = ["pydantic>=2.11,<3", "jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8.3", "hypothesis>=6.130", "ruff>=0.11", "pyright>=1.1.400", "types-jsonschema>=4.23"]

[project.scripts]
openverify = "openverify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openverify"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/draft" = "openverify/data/schemas"
"profiles/standard-draft/profile.json" = "openverify/data/profile.json"
"conformance" = "openverify/data/conformance"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

