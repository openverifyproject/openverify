[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openverify-code"
version = "0.1.1"
description = "Local Python code checks for OpenVerify"
requires-python = ">=3.13,<3.14"
dependencies = ["openverify-relay==0.1.1"]

[project.optional-dependencies]
tools = ["ruff>=0.17", "pytest>=8.3", "ast-grep-cli>=0.50"]

[tool.setuptools.packages.find]
where = ["src"]
